[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snote-video"
version = "0.1.0b1"
description = "Local video subtitle generation, translation, timing edits, and preview."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
audio = ["faster-whisper==1.2.1", "sentencepiece>=0.2,<0.3"]

[project.scripts]
snote_video = "snote_video.__main__:main"

[tool.setuptools.packages.find]
include = ["snote_video*"]

[tool.setuptools.package-data]
snote_video = ["static/*"]
